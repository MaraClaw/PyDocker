name: Publish docs via GitHub Pages
on:
  release:
    types: [created]
  workflow_dispatch: {}

jobs:
  build:
    name: Deploy docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.14.8"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: prepare
        run: |
          uv run --locked python -m docs.autogen
          cp docs/mkdocs.yml mkdocs.yml
      - name: Deploy docs
        run: uv run --locked mkdocs gh-deploy --config-file mkdocs.yml --force
