name: Publish docs via GitHub Pages

on:
  workflow_call:
    inputs:
      publisher_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      publisher_run_id:
        description: Successful publisher run containing the confirmed receipt
        required: true
        type: string

permissions: {}

concurrency:
  group: pages-tested-delivery
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14.10"
      - name: Verify receipt, destination, release and matching rendered site
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          PUBLISHER_RUN_ID: ${{ inputs.publisher_run_id }}
        run: uv run --locked python -m scripts.delivery pages --run-id "$PUBLISHER_RUN_ID" --output delivery-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: delivery-site
          include-hidden-files: true
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify actual Pages tar preserves every tested file
        run: uv run --locked python -m scripts.delivery verify-pages --output delivery-site --archive "$RUNNER_TEMP/artifact.tar"
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
