name: Publish docs via GitHub Pages
on:
  release:
    types: [created]
  workflow_dispatch: {}

jobs:
  build:
    name: Deploy docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14.8"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: prepare
        run: uv run --locked python -m docs.autogen
      - name: Deploy docs
        run: uv run --locked mkdocs gh-deploy --config-file docs/mkdocs.yml --force
