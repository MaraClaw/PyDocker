name: Run tests

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  render-docs:
    name: Render docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.14.8"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: prepare
        run: |
          ./scripts/ci-podman-update.sh
          uv run --locked python -m docs.autogen
          cp docs/mkdocs.yml mkdocs.yml
      - name: Render
        run: uv run --locked mkdocs build --config-file mkdocs.yml
      - uses: actions/upload-artifact@v4
        with:
          name: Docs
          path: site

  build-linux-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.14.8"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run all checks
        run: |
          uv run --locked ruff check ./
          uv run --locked ruff format --check ./
          uv run --locked ty check

  build-linux-test-component:
    strategy:
      fail-fast: false
      matrix:
        component:
          - buildx
          - test_compose.py
          - test_config.py
          - test_container.py
          - test_context.py
          - test_image.py
          - test_manifest.py
          - test_network.py
          - test_node.py
          - test_plugin.py
          - test_pod.py
          - test_service.py
          - test_stack.py
          - test_swarm.py
          - test_system.py
          - test_task.py
          - test_volume.py
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.14.8"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Setup Podman and Docker
        run: |
          ./scripts/ci-setup.sh
      - name: Run tests
        run: |
          uv run --locked pytest -vv --no-runtime-skip --durations=10 tests/pydocker/components/${{ matrix.component }}

  build-linux-test-other:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.14.8"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Setup Podman and Docker
        run: |
          ./scripts/ci-setup.sh
      - name: Run tests
        run: |
          uv run --locked pytest -vv --no-runtime-skip --durations=10 --ignore=tests/pydocker/components/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.14.8"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Setup
        run: |
          docker info
          docker run hello-world
      - name: Run single test
        run: |
          uv run --locked pytest -vv --no-runtime-skip -m "not podman" tests/pydocker/components/test_volume.py::test_simple_volume
