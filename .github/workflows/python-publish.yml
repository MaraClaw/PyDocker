name: Upload Python Package

on:
  workflow_run:
    workflows: ['Run tests']
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: pypi-tested-delivery
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested distributions
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
      PRODUCER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14.10"
      - name: Verify producer and select exact missing PyPI files
        id: prepare
        run: uv run --locked python -m scripts.delivery prepare --run-id "$PRODUCER_RUN_ID" --output delivery-upload
      - name: Publish exact downloaded bytes without rebuilding
        if: steps.prepare.outputs.pending == 'true'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_PUBLISH_PACKAGE_TOKEN }}
          packages-dir: delivery-upload/
          attestations: false
      - name: Confirm both destination hashes before issuing receipt
        run: uv run --locked python -m scripts.delivery confirm --run-id "$PRODUCER_RUN_ID" --output delivery-receipt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-receipt/receipt.json
          if-no-files-found: error
