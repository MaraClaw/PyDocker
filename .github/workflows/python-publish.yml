name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.14.8"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Build distributions
        run: uv build --no-sources --sdist --wheel
      - name: Smoke check the exact wheel
        id: distribution
        run: |
          project_version=$(uv run --locked python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          wheel="$PWD/dist/pywhales-${project_version}-py3-none-any.whl"
          printf 'version=%s\n' "$project_version" >> "$GITHUB_OUTPUT"
          uv run --isolated --no-project --no-config --python 3.14.8 --with "$wheel" -- python -I -c "import importlib.metadata, importlib.util, sys; from importlib.resources import files; from pywhales import DockerClient; assert callable(DockerClient); assert importlib.metadata.version('pywhales') == sys.argv[1]; assert files('pywhales').joinpath('py.typed').is_file(); assert importlib.util.find_spec('python_on_whales') is None" "$project_version"
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_PUBLISH_PACKAGE_TOKEN }}
      - name: Smoke check the published version
        env:
          PROJECT_VERSION: ${{ steps.distribution.outputs.version }}
        run: |
          uv run --isolated --no-project --no-config --no-cache --python 3.14.8 --default-index https://pypi.org/simple --with "pywhales==$PROJECT_VERSION" -- python -I -c "import importlib.metadata, importlib.util, sys; from importlib.resources import files; from pywhales import DockerClient; assert callable(DockerClient); assert importlib.metadata.version('pywhales') == sys.argv[1]; assert files('pywhales').joinpath('py.typed').is_file(); assert importlib.util.find_spec('python_on_whales') is None" "$PROJECT_VERSION"
