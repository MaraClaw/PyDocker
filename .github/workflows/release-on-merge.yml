name: Release on merge

on:
  workflow_run:
    workflows: ['Upload Python Package']
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14.10"
      - name: Verify confirmed publisher receipt and exact release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          PUBLISHER_RUN_ID: ${{ github.event.workflow_run.id }}
          PUBLISHER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: uv run --locked python -m scripts.delivery release --run-id "$PUBLISHER_RUN_ID"

  pages:
    needs: release
    permissions:
      contents: read
      actions: read
      pull-requests: read
      pages: write
      id-token: write
    uses: ./.github/workflows/gh-pages.yml
    with:
      publisher_run_id: ${{ format('{0}', github.event.workflow_run.id) }}
